    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('aos_theme_v2');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0B192C');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        window.__aosDeferredInstallPrompt = null;
        window.__aosAppInstalled = false;
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__aosDeferredInstallPrompt = event;
          window.dispatchEvent(new CustomEvent('aos-pwa-prompt-captured'));
        });
        window.addEventListener('appinstalled', function () {
          window.__aosDeferredInstallPrompt = null;
          window.__aosAppInstalled = true;
          window.dispatchEvent(new CustomEvent('aos-pwa-installed'));
        });
      })();
    </script>
